<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Data - Global Air Quality</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --accent: #2563eb;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-font-smoothing: antialiased;
        }
        .container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2.5rem;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            position: relative;
        }
        h1 {
            margin-top: 0;
            text-align: center;
            font-weight: 800;
            font-size: 1.75rem;
            letter-spacing: -0.025em;
            color: #111827;
        }
        .back-btn {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.875rem;
            transition: color 0.2s ease;
        }
        .back-btn:hover {
            color: #111827;
        }
        .cities-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1.5rem 0;
            max-height: 350px;
            overflow-y: auto;
            padding-right: 1rem;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            transition: background 0.2s ease;
        }
        .checkbox-container:hover {
            background: #f3f4f6;
        }
        input[type="checkbox"] {
            width: 1.125rem;
            height: 1.125rem;
            cursor: pointer;
            accent-color: var(--accent);
        }
        .btn {
            display: block;
            width: 100%;
            background: var(--accent);
            color: #ffffff;
            padding: 0.875rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            text-align: center;
            margin-top: 2rem;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .btn:hover {
            background: #1d4ed8;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            padding: 0 0.5rem;
        }
        .controls a {
            color: var(--accent);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
        }
        .controls a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-btn">&larr; Back</a>
    <div class="container">
        <h1>Download Data</h1>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Select the cities you want to include in the CSV.</p>
        
        <div class="controls">
            <a id="select-all">Select All</a>
            <a id="deselect-all">Deselect All</a>
        </div>
        
        <div class="cities-list" id="cities-container">
            <div style="text-align: center; color: var(--text-muted);">Loading cities...</div>
        </div>
        
        <button class="btn" id="download-btn">Download CSV</button>
    </div>

    <script>
        let globalData = {};

        async function loadCities() {
            try {
                const response = await fetch(`data.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('Data file not found');
                globalData = await response.json();
                
                const container = document.getElementById('cities-container');
                container.innerHTML = '';
                
                const cities = Object.keys(globalData).sort();
                
                if (cities.length === 0) {
                    container.innerHTML = '<div style="text-align: center; color: var(--text-muted);">No data available to download.</div>';
                    document.getElementById('download-btn').disabled = true;
                    return;
                }

                cities.forEach(city => {
                    const label = document.createElement('label');
                    label.className = 'checkbox-container';
                    label.innerHTML = `
                        <input type="checkbox" value="${city}" checked>
                        ${city}
                    `;
                    container.appendChild(label);
                });
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('cities-container').innerHTML = 
                    `<div style="color: #ef4444; text-align: center;">Failed to load data.</div>`;
            }
        }

        function convertToCSV(dataArray) {
            if (dataArray.length === 0) return '';
            
            // Get all possible keys to form headers
            const keysSet = new Set();
            dataArray.forEach(row => {
                Object.keys(row).forEach(k => keysSet.add(k));
            });
            keysSet.delete('City');
            const headers = ['City', ...Array.from(keysSet)];
            
            const csvRows = [];
            csvRows.push(headers.join(','));
            
            dataArray.forEach(row => {
                const values = headers.map(header => {
                    if (header === 'City') return `"${row.City}"`;
                    let val = row[header] !== undefined ? row[header] : '';
                    // Escape quotes in value
                    val = String(val).replace(/"/g, '""');
                    return `"${val}"`;
                });
                csvRows.push(values.join(','));
            });
            
            return csvRows.join('\n');
        }

        document.getElementById('select-all').addEventListener('click', () => {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = true);
        });

        document.getElementById('deselect-all').addEventListener('click', () => {
            document.querySelectorAll('input[type="checkbox"]').forEach(cb => cb.checked = false);
        });

        document.getElementById('download-btn').addEventListener('click', () => {
            const checkboxes = document.querySelectorAll('input[type="checkbox"]:checked');
            const selectedCities = Array.from(checkboxes).map(cb => cb.value);
            
            if (selectedCities.length === 0) {
                alert('Please select at least one city.');
                return;
            }
            
            // Combine data
            const combinedData = [];
            selectedCities.forEach(city => {
                const records = globalData[city] || [];
                records.forEach(record => {
                    combinedData.push({ City: city, ...record });
                });
            });
            
            const csvContent = convertToCSV(combinedData);
            
            // Trigger download
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', 'air_quality_data.csv');
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });

        // Initialize
        loadCities();
    </script>
</body>
</html>
