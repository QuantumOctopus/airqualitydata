<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Air Quality Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f9fafb;
            --card-bg: #ffffff;
            --text-main: #111827;
            --text-muted: #6b7280;
            --border-color: #e5e7eb;
            --accent: #2563eb;
            --good: #10b981;
            --moderate: #f59e0b;
            --unhealthy-sensitive: #f97316;
            --unhealthy: #ef4444;
            --very-unhealthy: #8b5cf6;
            --hazardous: #9f1239;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        header {
            padding: 4rem 1.5rem 2rem;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        h1 {
            font-weight: 800;
            font-size: 2.25rem;
            margin: 0;
            letter-spacing: -0.025em;
            color: #111827;
        }

        .subtitle {
            color: var(--text-muted);
            margin-top: 0.25rem;
            font-size: 1.05rem;
            font-weight: 400;
        }

        .download-btn {
            position: absolute;
            top: 4.5rem;
            right: 1.5rem;
            background: #ffffff;
            color: #111827;
            padding: 0.5rem 1rem;
            text-decoration: none;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s ease;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }

        .download-btn:hover {
            background: #f3f4f6;
            border-color: #d1d5db;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1.5rem 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            position: relative;
            transition: box-shadow 0.2s ease;
        }

        .card:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-color);
        }

        .city-name {
            font-size: 1.125rem;
            font-weight: 600;
            margin: 0;
            letter-spacing: -0.01em;
        }

        .timestamp {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
            font-variant-numeric: tabular-nums;
        }

        .aqi-container {
            display: flex;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .aqi-value {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
            margin-right: 1.25rem;
            letter-spacing: -0.05em;
        }

        .aqi-label {
            font-size: 0.875rem;
            font-weight: 600;
            letter-spacing: 0.025em;
        }

        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: auto;
        }

        .metric {
            padding: 0;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 0.125rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 500;
        }

        .metric-value {
            font-size: 1.125rem;
            font-weight: 500;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
        }

        .loader {
            text-align: center;
            padding: 4rem;
            color: var(--text-muted);
            grid-column: 1 / -1;
            font-size: 0.875rem;
        }

        /* AQI Colors */
        .aqi-good {
            color: var(--good);
        }

        .aqi-moderate {
            color: var(--moderate);
        }

        .aqi-unhealthy-sensitive {
            color: var(--unhealthy-sensitive);
        }

        .aqi-unhealthy {
            color: var(--unhealthy);
        }

        .aqi-very-unhealthy {
            color: var(--very-unhealthy);
        }

        .aqi-hazardous {
            color: var(--hazardous);
        }

        .bg-good {
            border-top: 4px solid var(--good);
        }

        .bg-moderate {
            border-top: 4px solid var(--moderate);
        }

        .bg-unhealthy-sensitive {
            border-top: 4px solid var(--unhealthy-sensitive);
        }

        .bg-unhealthy {
            border-top: 4px solid var(--unhealthy);
        }

        .bg-very-unhealthy {
            border-top: 4px solid var(--very-unhealthy);
        }

        .bg-hazardous {
            border-top: 4px solid var(--hazardous);
        }
    </style>
</head>

<body>
    <header>
        <a href="download.html" class="download-btn">Download Data</a>
        <h1>Global Air Quality</h1>
        <p class="subtitle">Real-time AQI monitoring</p>
    </header>

    <main class="container" id="dashboard">
        <div class="loader">Loading latest data...</div>
    </main>

    <script>
        function getAQICategory(aqi) {
            if (aqi <= 50) return { label: 'Good', class: 'good' };
            if (aqi <= 100) return { label: 'Moderate', class: 'moderate' };
            if (aqi <= 150) return { label: 'Unhealthy for Sensitive Groups', class: 'unhealthy-sensitive' };
            if (aqi <= 200) return { label: 'Unhealthy', class: 'unhealthy' };
            if (aqi <= 300) return { label: 'Very Unhealthy', class: 'very-unhealthy' };
            return { label: 'Hazardous', class: 'hazardous' };
        }

        async function loadData() {
            try {
                // Add a cache buster to ensure we get the latest data
                const response = await fetch(`data.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('Data file not found');
                const data = await response.json();

                const dashboard = document.getElementById('dashboard');
                dashboard.innerHTML = '';

                // Process each city
                for (const [city, records] of Object.entries(data)) {
                    // Get the most recent valid record (one that actually has an AQI)
                    if (!records || records.length === 0) continue;

                    let latest = null;
                    for (let i = records.length - 1; i >= 0; i--) {
                        if (records[i]['AQI+'] && records[i]['AQI+'] !== "") {
                            latest = records[i];
                            break;
                        }
                    }

                    if (!latest) continue;

                    const aqiValue = parseInt(latest['AQI+']) || 0;
                    const aqiInfo = getAQICategory(aqiValue);

                    const card = document.createElement('div');
                    card.className = `card bg-${aqiInfo.class}`;

                    card.innerHTML = `
                        <div class="card-header">
                            <div>
                                <h2 class="city-name">${city}</h2>
                                <div class="timestamp">${latest['Date']} ${latest['Time']}</div>
                            </div>
                        </div>
                        
                        <div class="aqi-container">
                            <div class="aqi-value aqi-${aqiInfo.class}">${latest['AQI+'] || 'N/A'}</div>
                            <div>
                                <div class="aqi-label aqi-${aqiInfo.class}">${aqiInfo.label}</div>
                                <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.25rem;">
                                    Pri. Pollutant: ${latest['Pri. Pollutant'] || 'Unknown'}
                                </div>
                            </div>
                        </div>
                        
                        <div class="metrics-grid">
                            <div class="metric">
                                <div class="metric-label">PM2.5</div>
                                <div class="metric-value">${latest['PM2.5 ug/m3'] || '--'} <span style="font-size:0.7rem;font-weight:400">µg/m³</span></div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">Temp</div>
                                <div class="metric-value">${latest['Temp F'] || '--'} <span style="font-size:0.7rem;font-weight:400">°F</span></div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">Humidity</div>
                                <div class="metric-value">${latest['Humidity'] || '--'} <span style="font-size:0.7rem;font-weight:400">%</span></div>
                            </div>
                            <div class="metric">
                                <div class="metric-label">Ozone</div>
                                <div class="metric-value">${latest['Ozone ug/m3'] || '--'} <span style="font-size:0.7rem;font-weight:400">µg/m³</span></div>
                            </div>
                        </div>
                    `;
                    dashboard.appendChild(card);
                }

                if (dashboard.innerHTML === '') {
                    dashboard.innerHTML = '<div class="loader">No data available yet.</div>';
                }
            } catch (error) {
                console.error('Error fetching data:', error);
                document.getElementById('dashboard').innerHTML =
                    `<div class="loader" style="color: var(--unhealthy);">
                        Failed to load data. The GitHub Action may not have run yet or you need to run the python script once to generate data.json.
                    </div>`;
            }
        }

        // Load data on start
        loadData();
    </script>
</body>

</html>
